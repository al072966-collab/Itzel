<style>
  :root { --hilo:#3a2418; --manta-c:#efe4cc; --rojo:#c8203a; --ocre:#f2b233; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#1a120d; color:var(--hilo); font-family:'Alegreya Sans', system-ui, sans-serif; overflow:hidden; user-select:none; }
  #wrap { position:fixed; inset:0; display:grid; place-items:center; }
  #game { display:block; cursor:none; }
  #textos { position:fixed; pointer-events:none; z-index:1; }
  .layer { position:fixed; inset:0; pointer-events:none; }
  img { image-rendering:auto; }
  /* carga directa (desde la enciclopedia): la misma espera de las cinemáticas (fondo café y una hilera de puntadas abajo a la derecha), no el menú */
  #espera-directa { display:none; position:fixed; inset:0; z-index:99999; background:#0d0806; }
  .directo #espera-directa { display:block; }
  #espera-directa .puntadas { position:absolute; right:48px; bottom:44px; display:flex; gap:0; }
  #espera-directa .puntadas svg { width:11px; height:11px; margin-left:1px; opacity:0; animation:espera-puntada 3.5s infinite; }
  #espera-directa .puntadas svg:nth-child(1) { animation-delay:0s; } #espera-directa .puntadas svg:nth-child(2) { animation-delay:.5s; } #espera-directa .puntadas svg:nth-child(3) { animation-delay:1s; } #espera-directa .puntadas svg:nth-child(4) { animation-delay:1.5s; } #espera-directa .puntadas svg:nth-child(5) { animation-delay:2s; } #espera-directa .puntadas svg:nth-child(6) { animation-delay:2.5s; } #espera-directa .puntadas svg:nth-child(7) { animation-delay:3s; }
  @keyframes espera-puntada { 0%, 8% { opacity:0; } 20%, 70% { opacity:1; } 90%, 100% { opacity:0; } }
  /* tela bordada */
  .panel { background:var(--manta) repeat; background-size:8px 8px; border:24px solid transparent; border-image:var(--marco) 24 round; box-shadow:0 10px 30px rgba(0,0,0,.45); }
  .patch { font:800 19px 'Alegreya Sans', sans-serif; color:#fff6e4; background:var(--rojo); border:0; border-radius:10px; padding:13px 34px; cursor:pointer; position:relative; box-shadow:0 0 0 3px #8e1428, 0 6px 0 #6a0f1e, 0 10px 24px rgba(0,0,0,.4); letter-spacing:.02em; margin:6px; }
  .patch::after { content:''; position:absolute; inset:5px; border:2px dashed rgba(255,240,215,.75); border-radius:6px; pointer-events:none; }
  .patch:hover { transform:translateY(-2px); }
  .patch:active { transform:translateY(3px); box-shadow:0 0 0 3px #8e1428, 0 2px 0 #6a0f1e; }
  .patch.verde { background:#3f8a4a; box-shadow:0 0 0 3px #245a2c, 0 6px 0 #1a4220, 0 10px 24px rgba(0,0,0,.4); }
  /* HUD */
  #hud { display:none; padding:12px 16px; }
  #hud.on { display:block; }
  .hrow { display:flex; align-items:center; gap:18px; flex-wrap:wrap; filter:drop-shadow(0 2px 3px rgba(0,0,0,.55)); }
  .hrow span { display:flex; align-items:center; gap:3px; color:#fff3dc; font:800 18px 'Alegreya Sans'; }
  .hrow img { height:22px; }
  #doblones { gap:4px; padding:3px 6px; border-radius:9px; background:rgba(51,31,20,.8); box-shadow:0 1px 3px #0006, inset 0 0 0 1px rgba(255,230,185,.35); }
  #doblones:empty { display:none; }
  #doblones .doblon-hud { width:23px; height:23px; display:grid; place-items:center; border-radius:50%; border:1px dashed #c6a880; background:rgba(255,245,220,.12); }
  #doblones .doblon-hud.conseguido { border:1px solid #ffe39a; background:#a25c19; box-shadow:0 0 5px #ffd57080; }
  #doblones canvas { width:21px; height:21px; display:block; }
  #hearts img.off { opacity:.28; filter:grayscale(1); }
  #bubbles img { height:18px; } #bubbles img.off { opacity:.3; }
  #perks img { height:20px; }
  #where { position:fixed; top:12px; right:16px; background:var(--manta) repeat; background-size:8px; padding:5px 14px 6px; border-radius:4px; font:700 15px 'Alegreya', serif; outline:2px dashed rgba(120,60,30,.45); outline-offset:-5px; box-shadow:0 3px 10px rgba(0,0,0,.4); }
  #where b { color:var(--rojo); }
  /* menú y enciclopedia dentro del juego */
  #where { right:70px; }
  #menuBtn { position:fixed; top:8px; right:14px; width:44px; height:40px; padding:0; font:800 22px 'Alegreya Sans'; pointer-events:auto; margin:0; }
  #menuBtn::after { inset:4px; }
  #enci { position:fixed; inset:0; z-index:50; display:none; background:#1a120d; }
  #enci.on { display:block; }
  #enci iframe { width:100%; height:100%; border:0; display:block; }
  #enci .patch { display:none; }   /* el libro ya trae su «Volver al juego» arriba; este flotante tapaba el contenido */
  /* Acceso constante al menú desde los submenús principales. */
  #screen .volver-esquina { position:fixed; top:clamp(32px, 10vh, 85px); left:clamp(26px, 3vw, 48px); z-index:20; margin:0; }
  #screen.on > div:has(.volver-esquina) { animation:none; padding-top:70px; }
  @media(max-width:600px) { #screen .volver-esquina { top:24px; left:24px; } }
  /* letrero de mundo */
  #banner { position:fixed; left:50%; top:14%; width:min(520px,88vw); transform:translateX(-50%); text-align:center; opacity:0; pointer-events:none; }
  #banner.on { animation: ban 3.4s ease forwards; }
  #banner .panel { position:relative; box-sizing:border-box; display:block; padding:16px 28px 19px 46px; overflow:hidden; border:3px solid #774331; border-image:none; border-radius:12px; color:#48271e; background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(153,110,67,.045) 5px 6px),#f7e9cd; box-shadow:0 5px 0 #542a20,0 12px 26px #26120d66,inset 0 0 0 3px #dfc197,inset 0 0 0 5px #fff4de; }
  #banner .panel:before { content:''; position:absolute; top:8px; bottom:8px; left:10px; width:19px; border-left:2px solid #8c2b3a; border-right:2px solid #8c2b3a; background:repeating-linear-gradient(45deg,#2c8080 0 3px,#f4d58e 3px 6px,#b93247 6px 9px,#f8e8c6 9px 12px); }
  #banner .panel:after { content:'✿'; position:absolute; right:12px; bottom:8px; color:#b33748; font:700 17px 'Alegreya Sans'; opacity:.85; }
  #banner small { display:flex; align-items:center; justify-content:center; gap:9px; font:800 11px 'Alegreya Sans'; letter-spacing:.18em; text-transform:uppercase; color:#a0273d; }
  #banner small:before, #banner small:after { content:'✦'; color:#bf8b50; font-size:10px; }
  #banner b { display:block; margin:5px 0; font:700 clamp(24px, 3vw, 34px) 'Alegreya', serif; line-height:1.08; text-wrap:balance; }
  #banner i { display:block; max-width:390px; margin:auto; font:italic 500 clamp(13px,1.4vw,15px)/1.25 'Alegreya', serif; color:#805548; text-wrap:balance; }
  @media(max-width:600px){#banner{top:12%;width:min(440px,90vw)}#banner .panel{padding:13px 22px 15px 38px}#banner .panel:before{left:8px;width:14px}#banner b{font-size:clamp(22px,6vw,30px)}}
  @keyframes ban { 0% { opacity:0; transform:translate(-50%, -10px); } 14%,78% { opacity:1; transform:translate(-50%, 0); } 100% { opacity:0; transform:translate(-50%, -8px); } }
  #toasts { position:fixed; left:50%; bottom:36px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast { background:var(--manta) repeat; background-size:8px; padding:7px 16px; border-radius:4px; font:700 15px 'Alegreya Sans'; outline:2px dashed rgba(120,60,30,.45); outline-offset:-5px; box-shadow:0 4px 12px rgba(0,0,0,.45); animation: tst 2.2s ease forwards; }
  @keyframes tst { 0% { opacity:0; transform:translateY(8px); } 12%,82% { opacity:1; transform:none; } 100% { opacity:0; } }
  /* pantallas */
  #screen { display:none; pointer-events:auto; background:radial-gradient(ellipse at center, rgba(30,18,12,.25), rgba(30,18,12,.78)); place-items:safe center; padding:20px; overflow:auto; }
  /* pantallas con letras sobre el mundo (pausa, ofrenda, final, logros…): el velo oscurece el centro, donde va el texto, y deja ver el mundo en las orillas */
  #screen.velo { background:radial-gradient(ellipse 78% 70% at center, rgba(22,13,9,.82), rgba(22,13,9,.66) 62%, rgba(22,13,9,.44)); }
  /* entrada suave de cada pantalla y de sus cartas (no se repite cuando la misma pantalla se vuelve a pintar) */
  @keyframes pantallaEntra { from { opacity:0; transform:translateY(12px) scale(.985); } }
  @keyframes cartaEntra { from { opacity:0; transform:translateY(30px) rotate(var(--r, 0deg)) scale(.94); } }
  #screen.on > div { animation:pantallaEntra .34s cubic-bezier(.2,.8,.2,1) backwards; }
  #screen .cards .card, #screen .skin-carta, #screen .est, #screen .logro { animation:cartaEntra .46s cubic-bezier(.2,.9,.25,1.12) backwards; animation-delay:calc(min(var(--i, 0), 14) * 45ms + 90ms); }
  #screen.quieta > div, #screen.quieta .card, #screen.quieta .skin-carta, #screen.quieta .est, #screen.quieta .logro { animation:none; }
  @media (prefers-reduced-motion: reduce) { #screen.on > div, #screen .card, #screen .skin-carta, #screen .est, #screen .logro { animation:none !important; } }
  #screen .stats, #screen .hint { text-wrap:balance; }
  #screen.on { display:grid; }
  body:has(#screen.on) #textos { visibility:hidden; }
  .title, .end, .ofrenda { text-align:center; max-width:900px; }
  :root { --logo:min(560px, 72vw); }
  .logo { width:var(--logo); filter:drop-shadow(0 6px 0 rgba(60,20,10,.35)) drop-shadow(0 12px 30px rgba(0,0,0,.5)); }
  .hstitch { max-width:min(760px, 88vw); height:auto; filter:drop-shadow(0 4px 0 rgba(60,20,10,.3)); }
  .sub { color:#fff1d8; font:italic 500 21px 'Alegreya', serif; margin:4px 0 22px; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .ctrl { display:flex; gap:26px; justify-content:center; margin:26px auto 4px; text-align:left; max-width:720px; flex-wrap:wrap; padding:6px 10px; }
  .ctrl div { font:500 16px 'Alegreya Sans'; line-height:1.45; display:grid; grid-template-columns:auto 1fr; column-gap:10px; align-items:center; }
  .ctrl img { height:30px; grid-row:span 2; }
  .ctrl span { color:#6a4a3a; }
  .hint { color:#f6e6c8; font:500 15px 'Alegreya Sans'; margin-top:16px; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  .hint b { color:var(--ocre); }
  .dato-camp { max-width:620px; margin:14px auto 0; padding:9px 14px; background:rgba(44,24,14,.72); border-radius:6px; color:#f6e6c8; font:500 15px/1.32 'Alegreya Sans'; text-align:left; }
  .dato-camp b { color:var(--ocre); } .dato-camp a { color:#ffdf97; text-decoration:underline; white-space:nowrap; }
  /* Derrota: puntadas y parches sobre el último cuadro del mundo. */
  #screen.velo:has(.pantalla-derrota){background:rgba(18,20,19,.72)}
  #screen:has(.pantalla-derrota):not(:has(.pantalla-pausa)){z-index:3}
  .pantalla-derrota{width:min(1040px,94vw);display:flex;flex-direction:column;align-items:center;gap:18px;padding:12px 4px 22px}
  .pantalla-derrota .derrota-titulo{width:min(580px,80vw);max-height:75px;object-fit:contain;filter:drop-shadow(0 4px 2px #180509aa)}
  .pantalla-derrota .corazones-vacios{display:flex;justify-content:center;gap:20px;color:#ffd1d2;filter:drop-shadow(0 2px 2px #3c1318aa)}
  .pantalla-derrota .corazones-vacios svg{width:58px;height:54px}
  .pantalla-derrota .worlds{margin:0;justify-content:center}
  .pantalla-derrota .worlds span{font:800 clamp(15px,1.5vw,18px) 'Alegreya Sans',sans-serif}
  .pantalla-derrota .worlds .here{position:relative;color:#9e1d3b;background:#ffdcda;border:2px solid #efabb0;border-radius:6px;padding:8px 18px;box-shadow:0 3px 0 #712b32,0 6px 16px #0005}
  .pantalla-derrota .worlds .here:after{content:'';position:absolute;inset:3px;border:1px dashed #db8190;border-radius:3px;pointer-events:none}
  .pantalla-derrota .sub{margin:0;font-size:18px}
  .acciones-derrota{display:flex;gap:16px;justify-content:center;align-items:stretch;flex-wrap:wrap;width:100%}
  .pantalla-derrota .boton-derrota{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:68px;margin:0;padding:14px 26px;border:3px solid #8f0d29;background:linear-gradient(180deg,#ea3150,#c51032 65%,#a70e2b);font:800 clamp(18px,2.3vw,27px) 'Alegreya Sans';text-transform:none;letter-spacing:0;box-shadow:inset 0 3px #ffffff3d,0 5px 0 #711125,0 9px 18px #0007}
  .pantalla-derrota .boton-derrota.verde{border-color:#296b37;background:linear-gradient(180deg,#5cb96a,#348b47 65%,#28733b);box-shadow:inset 0 3px #ffffff3d,0 5px 0 #20582e,0 9px 18px #0007}
  .pantalla-derrota .boton-derrota:after{inset:5px;border:2px dashed #fff5dfd9;border-radius:6px}
  .pantalla-derrota .boton-derrota:hover{filter:brightness(1.12)}
  .pantalla-derrota .boton-derrota:focus-visible{outline:3px solid #ffe18e;outline-offset:5px}
  .pantalla-derrota .boton-simbolo{display:grid;place-items:center;flex:none;width:34px;height:34px;border:1px solid #fff8d68a;border-radius:50%;background:#ffffff24;color:#fff4dd;font:700 24px/1 'Alegreya Sans';text-shadow:0 1px 2px #47251c}
  .pantalla-derrota .dato-camp{max-width:680px;margin:4px auto 0;padding:14px 26px;border:1px solid #b9895c66;border-radius:14px;background:rgba(60,31,17,.88);color:#fff5e8;text-align:center;font:500 clamp(16px,1.5vw,20px)/1.35 'Alegreya Sans';box-shadow:inset 0 0 0 3px #ffffff0d,0 5px 18px #0003}
  .pantalla-derrota .dato-camp b{display:block;margin-bottom:3px;font:800 clamp(20px,2vw,26px) 'Alegreya Sans';color:#ffc048}
  .acciones-pausa{display:flex;gap:16px;justify-content:center;align-items:stretch;flex-wrap:wrap;width:100%}
  .acciones-pausa .patch,.acciones-derrota .patch{margin:0}
  .pantalla-pausa .pausa-sonido{background:#317eaf;box-shadow:0 0 0 3px #235c88,0 6px 0 #174666,0 10px 24px rgba(0,0,0,.4)}
  .pantalla-pausa .pausa-opciones{background:#86519a;box-shadow:0 0 0 3px #704181,0 6px 0 #532c60,0 10px 24px rgba(0,0,0,.4)}
  .patch.amarillo{background:#e4a927;color:#fff6e4;box-shadow:0 0 0 3px #aa7311,0 6px 0 #805009,0 10px 24px rgba(0,0,0,.4)}
  .patch.amarillo::after{border-color:rgba(255,248,215,.8)}
  @media(max-width:600px){.acciones-pausa{gap:10px}.acciones-pausa .patch{min-height:54px;flex:1 1 40%;padding:10px 16px}}
  @media(max-width:600px){.pantalla-derrota{gap:12px}.pantalla-derrota .corazones-vacios svg{width:42px;height:39px}.acciones-derrota{gap:10px}.pantalla-derrota .boton-derrota{width:100%;min-height:54px;padding:10px 18px}.pantalla-derrota .dato-camp{padding:10px 14px}}
  .cards { display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
  .card { width:232px; cursor:pointer; display:flex; flex-direction:column; gap:6px; align-items:center; font-family:'Alegreya Sans'; color:var(--hilo); padding:4px 6px 8px; transition:transform .15s; transform:rotate(var(--r, 0deg)); }
  .card:hover { transform:translateY(-6px) rotate(0); }
  .card img { height:52px; margin:2px 0; }
  .card b { font:700 21px 'Alegreya', serif; }
  .card span:last-child { font-size:15.5px; line-height:1.35; color:#5a3c2c; }
  /* ---- elegir camino ---- */
  .camino .cards { gap:26px; margin-top:10px; }
  .camino .card { width:min(340px, 86vw); gap:3px; padding:0 2px 8px; }
  .camino .card canvas { width:100%; aspect-ratio:427/240; display:block; border-radius:3px; margin-bottom:6px; background:rgba(60,30,20,.18); }
  .camino .card small { font:700 12px 'Alegreya Sans'; letter-spacing:.14em; text-transform:uppercase; color:#8a5a3a; }
  .camino .card b { font-size:24px; line-height:1.1; }
  .camino .card i { font:800 14px 'Alegreya Sans'; font-style:normal; color:#fff6e4; background:var(--rojo); border-radius:4px; padding:2px 10px; margin:3px 0 4px; }
  .worlds { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:14px 0 8px; }
  .worlds span { font:700 14px 'Alegreya Sans'; padding:4px 12px; border-radius:3px; background:#efe4cc; color:#7a6050; outline:2px dashed rgba(120,60,30,.35); outline-offset:-4px; }
  .worlds .done { background:#cfe6c6; color:#2a5a2a; }
  .worlds .here { background:#f6c8c0; color:#8a1a2a; }
  .stats { color:#fff1d8; font:500 17px 'Alegreya', serif; margin:6px 0 20px; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  .win .resumen-partida { width:min(760px,90vw); margin:18px auto; padding:16px; box-sizing:border-box; border:2px solid #c9a575; border-radius:12px; background:rgba(49,27,18,.9); box-shadow:0 5px 18px #0006,inset 0 0 0 3px #fff4d411; }
  .resumen-partida h3 { margin:0 0 12px; color:#ffe5a3; font:700 21px 'Alegreya',serif; }
  .resumen-datos { display:grid; grid-template-columns:repeat(auto-fit,minmax(125px,1fr)); gap:8px; }
  .resumen-dato { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:92px; padding:9px 6px; border:1px dashed #b78e62; border-radius:8px; background:#fff3d9; color:#593629; font-family:'Alegreya Sans',sans-serif; }
  .resumen-dato span { font-size:13px; font-weight:700; line-height:1.1; }
  .resumen-dato strong { margin:4px 0; color:#a3203a; font-size:25px; line-height:1; font-variant-numeric:tabular-nums; }
  .resumen-dato small { font-size:12px; line-height:1.2; }
  @media(max-width:600px) { .resumen-datos { grid-template-columns:repeat(2,minmax(0,1fr)); } .resumen-dato { min-height:76px; } }
  #loading { display:none; place-items:center; background:#1a120d; }
  #loading.on { display:grid; }
  #loading div { text-align:center; color:#d8c4a8; font:italic 500 18px 'Alegreya', serif; }
  #loading b { display:block; font:700 30px 'Alegreya', serif; color:#fff1d8; margin-top:6px; font-style:normal; }
  /* ---- menú principal ---- */
  .menu-lista { display:grid; width:min(440px, 90vw); margin:6px auto 0; padding:2px 10px; }
  .opcion { display:grid; grid-template-columns:48px 1fr; column-gap:12px; align-items:center; text-align:left; background:none; border:0; border-bottom:2px dashed rgba(120,60,30,.28); padding:11px 10px; cursor:pointer; color:var(--hilo); font-family:'Alegreya Sans'; transition:background .15s, transform .15s; }
  .opcion:last-child { border-bottom:0; }
  .opcion:hover { background:rgba(200,32,58,.09); transform:translateX(4px); }
  .opcion img { grid-row:span 2; height:36px; justify-self:center; }
  .opcion b { font:700 26px 'Alegreya', serif; line-height:1.05; }
  .opcion span { color:#7a5a44; font-size:15px; }
  kbd { display:inline-block; min-width:22px; padding:1px 7px; margin:0 2px; border-radius:5px; background:#fff8e8; border:1px solid #b8946a; box-shadow:0 2px 0 #b8946a; font:700 14px 'Alegreya Sans'; color:#4a2a1a; }
  /* ---- controles ---- */
  .ctrl2 { display:flex; gap:22px; justify-content:center; flex-wrap:wrap; margin:14px auto 6px; max-width:860px; }
  .ctrl2 .panel { width:min(400px, 90vw); text-align:left; padding:4px 12px; font:500 16px 'Alegreya Sans'; color:#5a3c2c; }
  .ctrl2 .panel img { height:34px; float:left; margin:2px 12px 0 0; }
  .ctrl2 .panel b { display:block; font:700 22px 'Alegreya', serif; color:var(--hilo); margin-bottom:6px; }
  .ctrl2 .panel p { margin:7px 0; line-height:1.5; }
  .hint kbd { box-shadow:none; }
  /* ---- skins ---- */
  .chips { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; max-width:960px; margin:8px auto 14px; }
  .chip { background:#efe4cc; color:#6a4a3a; border:0; border-radius:4px; outline:2px dashed rgba(120,60,30,.35); outline-offset:-4px; padding:6px 12px; font:700 14px 'Alegreya Sans'; cursor:pointer; }
  .chip small { margin-left:6px; color:#a07a5a; } .chip.on { background:#f6c8c0; color:#8a1a2a; } .chip.nada { opacity:.55; }
